[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"
[project]
name = "rillwatch"
version = "1.0.0"
description = "Durable stream quality monitoring and prediction-shift diagnostics"
requires-python = ">=3.11"
dependencies = []
[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.12,<1", "build>=1,<2"]
reports = ["matplotlib>=3.9,<4", "pandas>=2.2,<4", "nbformat>=5,<6", "nbclient>=0.10,<1", "ipykernel>=6,<8"]
[project.scripts]
rillwatch = "rillwatch.cli:main"
[tool.setuptools.packages.find]
where = ["src"]
[tool.ruff]
line-length = 88
[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]
